name: Kütüphane doğrulaması

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.14']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: FFmpeg kurulumu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Python testleri
        env:
          CWI_TEST_FFMPEG: ${{ runner.os == 'Linux' && '/usr/bin/ffmpeg' || '' }}
        run: python -m unittest discover -s tests -v
      - name: Bütün kütüphane doğrulamaları
        run: python tools/validate_all.py
      - name: Node runtime testleri
        run: node --test tests/*.test.mjs
